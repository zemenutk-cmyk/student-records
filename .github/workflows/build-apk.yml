name: Build Android APK

# Runs automatically every time you upload/change code on GitHub.
# When it finishes, download the APK from the "Actions" tab of this
# repository under the finished run's "Artifacts" section.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java (required for Android build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verify encryption secret is set
        run: |
          if [ -z "${{ secrets.VITE_DB_SECRET }}" ]; then
            echo "❌ VITE_DB_SECRET repository secret is not set."
            echo "Go to Settings > Secrets and variables > Actions > New repository secret"
            echo "and add VITE_DB_SECRET with a long random value before building."
            exit 1
          fi

      - name: Install web dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_DB_SECRET: ${{ secrets.VITE_DB_SECRET }}
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cise-student-records-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
